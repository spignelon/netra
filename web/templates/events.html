{{define "events.html"}}
<!doctype html>
<html lang="en"{{if eq .Theme "light"}} data-theme="light"{{else if eq .Theme "dark"}} data-theme="dark"{{end}}>
<head>
  <title>{{if .Concealed}}Events - Nextcloud{{else}}Events — Netra{{end}}</title>
  {{template "head" .}}
</head>
<body>
  {{template "topnav" .}}
  <main class="page">
    <div class="page-header">
      <h1>Events</h1>
    </div>

    <section class="card">
      <div id="eventsRoot" data-show-link-col="1" data-csrf="{{.CSRF}}">
        <div class="events-toolbar">
          <input type="search" id="eventsSearch" placeholder="Search IP, location, ISP, device, link…">
          <select id="eventsType">
            <option value="">All types</option>
            <option value="view">View</option>
            <option value="click">Click</option>
            <option value="pixel_open">Pixel open</option>
            <option value="gps">GPS capture</option>
          </select>
          <button type="button" id="eventsDeleteSelected" class="btn btn-danger btn-sm" disabled>Delete selected</button>
        </div>
        <p class="muted text-xs mb-2">Click a row to see everything captured for that event.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th><input type="checkbox" id="eventsSelectAll" title="Select all"></th><th></th><th>Time</th><th>Link</th><th>Type</th><th>IP</th><th>Location</th><th>ISP/Org</th><th>Device</th><th>GPS</th></tr>
            </thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
        <div class="events-sentinel" id="eventsSentinel"></div>
        <p class="events-status" id="eventsStatus"></p>
      </div>
      <noscript><p class="muted">Enable JavaScript to browse the event log, or use <a href="/admin/events.csv">CSV export</a>.</p></noscript>
    </section>
  </main>
  <script src="/static/autorefresh.js"></script>
  <script src="/static/event-modal.js"></script>
  <script src="/static/events.js"></script>
</body>
</html>
{{end}}
